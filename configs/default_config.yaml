  faiss_index_stage_1: 'data/databases/vector/faiss_index_stage1_pruned_089.bin'
  faiss_index_stage_2_opencv: 'data/databases/vector/faiss_index_stage2_opencv_pruned_091.bin'
  faiss_index_stage_2_sam2: 'data/databases/vector/faiss_index_stage2_pruned_093.bin'
  sqlite_db_stage_1: 'data/databases/sql/plankton_db_stage1_pruned_089.sqlite'
  sqlite_db_stage_2_opencv: 'data/databases/sql/plankton_db_stage2_opencv_pruned_091.sqlite'
  sqlite_db_stage_2_sam2: 'data/databases/sql/plankton_db_stage2_pruned_093.sqlite'
  ckpt_stage_1: 'data/models/weights/resnet50_stage1.pth'
  ckpt_stage_2_opencv: 'data/models/weights/resnet50_stage2_opencv.pth'
  ckpt_stage_2_sam2: 'data/models/weights/resnet50_stage2_sam2.pth'
  areas_json: 'output/species_results_areas.json'
  species_json: 'output/inference_results.json'
