  lehette_params: 'data/databases/lehette_parameters.json'

model:
  name: 'resnet50timm'

# Stage-2 segmentation backend used to isolate the specimen and measure its area.
#   method: 'opencv' -> default heuristic (Otsu + morphology). No extra deps.
#   method: 'sam2'   -> Segment Anything Model 2 (Meta). Optional dependency:
#                       install with `pip install -r requirements-sam2.txt` and
#                       download the checkpoint (see README, "Optional: SAM2
#                       segmentation"). The sam2 package is imported lazily, so
#                       the 'opencv' path never requires it.
segmentation:
  method: 'opencv'
  sam2:
    # Hydra config name bundled inside the installed `sam2` package.
    model_cfg: 'configs/sam2.1/sam2.1_hiera_l.yaml'
    # Local path to the SAM2 checkpoint (.pt). Excluded from git; download from
    # the project's Zenodo record. See README for the exact link.
    checkpoint: 'data/models/weights/sam2/sam2.1_hiera_large.pt'
    # Prompt-point strategy: 'mesh' (grid of interior points) or 'center'
    # (single deepest interior point). 'mesh' is more robust for thin appendages.
    prompt_method: 'mesh'
    # Target number of grid points when prompt_method is 'mesh'.
    points_density: 500

transforms:
  stage1:
    mean: [0.0418, 0.0353, 0.0409]
    std: [0.0956, 0.0911, 0.0769]
  stage2:
    mean: [0.0425, 0.0436, 0.0432]
    std: [0.1466, 0.1488, 0.1476]

# Pixel length for DYB-PlanktonNet is 7.38 μm. Area per pixel in mm^2 = (7.38 * 10^-3)^2
pixel_to_mm2: 0.0000544644

# FAISS cosine-similarity thresholds for OOD (Out-Of-Distribution) rejection.
# The FAISS indices use Inner Product on L2-normalised embeddings, so the search
# score is a cosine similarity in [-1, 1] (higher = more similar). A sample is
# REJECTED when its nearest-neighbour similarity falls BELOW the threshold.
# The pipeline no longer uses the ground truth to gate Stage-1; this OOD gate
# replaces it. A very negative value disables the gate (nothing is ever rejected).
# Replace with calibrated values (e.g. from an In-Distribution validation set)
# to enable OOD rejection.
cosine_threshold_stage_1: -9999.0
cosine_threshold_stage_2: -9999.0

runtime:
  save_plot_figures: false
  compile_models: true